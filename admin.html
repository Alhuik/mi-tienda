<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para el formulario de administración */
        .admin-box { background: white; max-width: 500px; margin: 30px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { background-color: #00adb5; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 1rem; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #008087; }
        .hidden { display: none !important; }
        .product-manager-list { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .admin-product-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .btn-delete { background-color: #ff4d4d; width: auto; padding: 5px 10px; font-size: 0.9rem; }
        .btn-delete:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <header>
        <h1>⚙️ Panel de Control</h1>
        <nav>
            <a href="index.html">Catálogo</a>
            <a href="admin.html" class="active">Admin</a>
        </nav>
    </header>

    <main>
        <div id="login-section" class="admin-box">
            <h2>🔐 Iniciar Sesión</h2>
            <div class="form-group">
                <label for="password">Introduce la contraseña de administrador:</label>
                <input type="password" id="password" placeholder="Tu contraseña aquí...">
            </div>
            <button onclick="checkPassword()">Entrar al Panel</button>
            <p id="login-error" style="color: red; margin-top: 10px; display: none;">❌ Contraseña incorrecta</p>
        </div>

        <div id="admin-section" class="admin-box hidden">
            <h2>✨ Añadir Nuevo Artículo</h2>
            <div class="form-group">
                <label for="prod-name">Nombre del artículo (Ej: Camiseta Anime):</label>
                <input type="text" id="prod-name" placeholder="Nombre...">
            </div>
            <div class="form-group">
                <label for="prod-price">Precio (€):</label>
                <input type="number" id="prod-price" placeholder="Precio en euros...">
            </div>
            <div class="form-group">
                <label for="prod-size">Talla disponible:</label>
                <select id="prod-size">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prod-desc">Descripción (Opcional):</label>
                <textarea id="prod-desc" rows="3" placeholder="Detalles de la prenda..."></textarea>
            </div>
            <button onclick="saveProduct()">Guardar en el Catálogo</button>

            <div class="product-manager-list">
                <h3>Tus artículos actuales:</h3>
                <div id="admin-products-grid"></div>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURACIÓN: Tu contraseña para entrar será "1234" (puedes cambiarla aquí abajo)
        const ADMIN_PASSWORD = "1234";

        function checkPassword() {
            const inputPass = document.getElementById('password').value;
            if (inputPass === ADMIN_PASSWORD) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                showAdminProducts();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const size = document.getElementById('prod-size').value;
            const description = document.getElementById('prod-desc').value;

            if (!name || !price) {
                alert('Por favor, rellena al menos el nombre y el precio.');
                return;
            }

            const newProduct = { name, price, size, description };
            
            // Cargar productos actuales, sumar el nuevo y volver a guardar
            const products = JSON.parse(localStorage.getItem('products')) || [];
            products.push(newProduct);
            localStorage.setItem('products', JSON.stringify(products));

            // Limpiar el formulario y avisar
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-desc').value = '';
            alert('¡Artículo guardado con éxito!');
            
            showAdminProducts();
        }

        function showAdminProducts() {
            const grid = document.getElementById('admin-products-grid');
            const products = JSON.parse(localStorage.getItem('products')) || [];
            grid.innerHTML = '';

            if(products.length === 0) {
                grid.innerHTML = '<p style="color:#777; font-style:italic;">No hay artículos guardados.</p>';
                return;
            }

            products.forEach((prod, index) => {
                const item = document.createElement('div');
                item.className = 'admin-product-item';
                item.innerHTML = `
                    <span><strong>${prod.name}</strong> - ${prod.price}€ (Talla ${prod.size})</span>
                    <button class="btn-delete" onclick="deleteProduct(${index})">Eliminar</button>
                `;
                grid.appendChild(item);
            });
        }

        function deleteProduct(index) {
            if(confirm('¿Seguro que quieres eliminar este artículo?')) {
                const products = JSON.parse(localStorage.getItem('products')) || [];
                products.splice(index, 1);
                localStorage.setItem('products', JSON.stringify(products));
                showAdminProducts();
            }
        }
    </script>
</body>
</html>
