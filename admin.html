<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>STUDIO COLL. / ADMIN</h1>
        <nav>
            <a href="index.html">Catálogo</a>
            <a href="admin.html" class="active">Admin</a>
        </nav>
    </header>

    <main>
        <div id="login-section" class="admin-box">
            <h2>🔐 Acceso Privado</h2>
            <div class="form-group">
                <label>Contraseña de acceso</label>
                <input type="password" id="password" placeholder="••••">
            </div>
            <button class="btn-primary" onclick="checkPassword()">Entrar</button>
            <p id="login-error" style="color: #ff4d4d; margin-top: 15px; display: none; font-size:0.9rem;">Contraseña incorrecta.</p>
        </div>

        <div id="admin-section" class="admin-box hidden">
            <h2>Añadir Nueva Prenda</h2>
            
            <div class="form-group">
                <label>Nombre de la prenda</label>
                <input type="text" id="prod-name" placeholder="Ej: Camiseta Oversize Negra">
            </div>

            <div class="form-group">
                <label>Enlace de la Foto (URL)</label>
                <input type="text" id="prod-img" placeholder="https://ejemplo.com/foto.jpg">
            </div>

            <div class="form-group">
                <label>Precio (€)</label>
                <input type="number" id="prod-price" placeholder="29.99">
            </div>

            <div class="form-group">
                <label>Descripción Corta</label>
                <textarea id="prod-desc" rows="2" placeholder="Materiales, corte..."></textarea>
            </div>

            <div class="sizes-stock-container">
                <label style="display:block; margin-bottom:10px; font-weight:600;">Inventario por Tallas:</label>
                <div class="size-row"><span>Talla S:</span> <input type="number" id="stock-S" value="0" min="0"></div>
                <div class="size-row"><span>Talla M:</span> <input type="number" id="stock-M" value="0" min="0"></div>
                <div class="size-row"><span>Talla L:</span> <input type="number" id="stock-L" value="0" min="0"></div>
                <div class="size-row"><span>Talla XL:</span> <input type="number" id="stock-XL" value="0" min="0"></div>
            </div>

            <button class="btn-primary" onclick="saveProduct()">Publicar en Catálogo</button>

            <div style="margin-top: 40px;">
                <h3>Inventario Actual</h3>
                <div id="admin-products-grid" style="margin-top:15px;"></div>
            </div>
        </div>
    </main>

    <script>
        const ADMIN_PASSWORD = "1234";

        function checkPassword() {
            if (document.getElementById('password').value === ADMIN_PASSWORD) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                showAdminProducts();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const image = document.getElementById('prod-img').value;
            const price = document.getElementById('prod-price').value;
            const description = document.getElementById('prod-desc').value;

            // Recoger los stocks de todas las tallas
            const stocks = {
                S: document.getElementById('stock-S').value || 0,
                M: document.getElementById('stock-M').value || 0,
                L: document.getElementById('stock-L').value || 0,
                XL: document.getElementById('stock-XL').value || 0
            };

            if (!name || !price) {
                alert('Pon al menos el nombre y el precio.');
                return;
            }

            const newProduct = { name, image, price, description, stocks };
            const products = JSON.parse(localStorage.getItem('products_v2')) || [];
            products.push(newProduct);
            localStorage.setItem('products_v2', JSON.stringify(products));

            // Limpiar formulario
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-img').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-desc').value = '';
            document.getElementById('stock-S').value = '0';
            document.getElementById('stock-M').value = '0';
            document.getElementById('stock-L').value = '0';
            document.getElementById('stock-XL').value = '0';

            alert('¡Publicado con éxito!');
            showAdminProducts();
        }

        function showAdminProducts() {
            const grid = document.getElementById('admin-products-grid');
            const products = JSON.parse(localStorage.getItem('products_v2')) || [];
            grid.innerHTML = '';

            if(products.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted); font-style:italic;">No hay artículos.</p>';
                return;
            }

            products.forEach((prod, index) => {
                const item = document.createElement('div');
                item.className = 'admin-product-item';
                item.innerHTML = `
                    <span><strong>${prod.name}</strong> - ${prod.price}€</span>
                    <button class="btn-delete" onclick="deleteProduct(${index})">Borrar</button>
                `;
                grid.appendChild(item);
            });
        }

        function deleteProduct(index) {
            if(confirm('¿Eliminar artículo?')) {
                const products = JSON.parse(localStorage.getItem('products_v2')) || [];
                products.splice(index, 1);
                localStorage.setItem('products_v2', JSON.stringify(products));
                showAdminProducts();
            }
        }
    </script>
</body>
</html>
