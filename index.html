<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Público</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand-section">
            <h1>STUDIO</h1>
            <span class="brand-subtitle">Colección Actual</span>
        </div>
        <div class="header-icons">
            <a href="index.html" style="color:var(--text-primary); text-decoration:none;">Catálogo</a>
            <a href="admin.html" style="color:var(--text-muted); text-decoration:none;">Admin</a>
            <span id="theme-btn" onclick="toggleTheme()">☀️</span>
        </div>
    </header>

    <main>
        <section>
            <div id="catalog-grid" class="products-grid"></div>
        </section>
    </main>

    <script>
        const PRODUCTS_KEY = "products_v3";

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-btn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.innerText = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️';
            }
        }

        function loadCatalog() {
            const catalogGrid = document.getElementById('catalog-grid');
            const allProducts = JSON.parse(localStorage.getItem(PRODUCTS_KEY)) || [];
            
            // FILTRO: Solo mostramos al público los que están marcados como "listos" en el admin
            const products = allProducts.filter(p => p.status === 'listos');

            if (products.length === 0) {
                catalogGrid.innerHTML = '<p style="color:var(--text-muted); font-style:italic; grid-column: 1 / -1; padding: 40px 0;">La colección se está actualizando. Vuelve pronto.</p>';
                return;
            }

            catalogGrid.innerHTML = '';

            products.forEach((product, pIndex) => {
                const totalStock = Object.values(product.stocks).reduce((a, b) => a + parseInt(b || 0), 0);
                const imgUrl = product.image && product.image.trim() !== '' ? product.image : 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500';

                let sizeOptions = '';
                for (const [size, qty] of Object.entries(product.stocks)) {
                    if (parseInt(qty) > 0) {
                        sizeOptions += `<option value="${size}">${size} - Quedan ${qty}</option>`;
                    }
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-container">
                        <div class="stock-badge" id="stock-display-${pIndex}">${totalStock > 0 ? 'En Stock' : 'Agotado'}</div>
                        <img src="${imgUrl}" alt="${product.name}" onerror="this.src='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500'">
                    </div>
                    <div class="product-info">
                        <div class="price-stock-summary" style="margin-bottom: 15px;">
                            <span class="product-name">${product.name}</span>
                            <span class="price">${product.price} €</span>
                        </div>
                        
                        <div style="margin-top: auto;">
                            <label style="display:block; font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px; letter-spacing:1px;">Selecciona tu talla</label>
                            <select class="size-select">
                                ${sizeOptions !== '' ? sizeOptions : '<option value="">Agotado</option>'}
                            </select>
                        </div>
                    </div>
                `;
                catalogGrid.appendChild(card);
            });
        }

        // MAGIA EN TIEMPO REAL: Si el localStorage cambia desde la pestaña del Admin, recargamos el catálogo al instante.
        window.addEventListener('storage', function(e) {
            if (e.key === PRODUCTS_KEY) {
                loadCatalog();
            }
        });

        window.onload = loadCatalog;
    </script>
</body>
</html>
