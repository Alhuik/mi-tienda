<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldFlex - Colección Actual</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .cart-panel {
            position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh;
            background: var(--card-bg); border-left: 1px solid var(--border-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 1000;
            transition: right 0.3s ease; padding: 30px; display: flex; flex-direction: column;
        }
        .cart-panel.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .cart-header h2 { margin: 0; font-size: 1.5rem; }
        .close-cart { cursor: pointer; font-size: 1.5rem; color: var(--text-muted); }
        .close-cart:hover { color: var(--text-primary); }
        
        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .cart-item-info p { margin: 0; font-size: 0.9rem; color: var(--text-muted); }
        .cart-item-info h4 { margin: 0 0 5px 0; font-size: 1rem; font-weight: 500; }
        .cart-item-price { font-weight: 600; }
        .remove-item { color: var(--badge-red); cursor: pointer; font-size: 0.8rem; margin-top: 5px; display: inline-block; }
        
        .cart-summary { background: var(--bg-color); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-color); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: var(--text-muted); }
        .summary-total { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); font-size: 1.2rem; font-weight: 600; color: var(--text-primary); }
        
        .cart-btn-header { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; background: var(--text-primary); color: var(--bg-color); padding: 8px 16px; border-radius: 20px; }
        .btn-add-cart { background: var(--bg-color); color: var(--text-primary); border: 1px solid var(--border-color); padding: 12px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius); transition: all 0.2s; }
        .btn-add-cart:hover { border-color: var(--text-primary); background: var(--text-primary); color: var(--bg-color); }
    </style>
</head>
<body>

    <header>
        <div class="brand-section">
            <h1>FieldFlex</h1>
            <span class="brand-subtitle">Colección Actual</span>
        </div>
        <div class="header-icons">
            <a href="admin.html" style="color:var(--text-muted); text-decoration:none; margin-right: 15px;">Admin</a>
            <span id="theme-btn" onclick="toggleTheme()" style="cursor:pointer; font-size:1.2rem; margin-right: 15px;">☀️</span>
            <div class="cart-btn-header" onclick="toggleCart()">
                🛒 Lista (<span id="cart-count">0</span>)
            </div>
        </div>
    </header>

    <main>
        <section>
            <div id="catalog-grid" class="products-grid"></div>
        </section>
    </main>

    <div id="cart-sidebar" class="cart-panel">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <span class="close-cart" onclick="toggleCart()">✕</span>
        </div>
        
        <div id="cart-items-container" class="cart-items">
            <p style="color: var(--text-muted); font-style: italic;">Tu lista está vacía.</p>
        </div>
        
        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">0.00 €</span>
            </div>
            <div class="summary-row">
                <span>Gastos de envío</span>
                <span id="cart-shipping">0.00 €</span>
            </div>
            <div class="summary-total">
                <span>TOTAL</span>
                <span id="cart-total">0.00 €</span>
            </div>
        </div>
    </div>

    <script>
        // TUS CLAVES DE FIREBASE DE FIELDFLEX
        const firebaseConfig = {
            apiKey: "AIzaSyA74KuExBxomsqX8ZqM42WVNJNGeqCPYNY",
            authDomain: "fieldflex-store.firebaseapp.com",
            databaseURL: "https://fieldflex-store-default-rtdb.firebaseio.com",
            projectId: "fieldflex-store",
            storageBucket: "fieldflex-store.firebasestorage.app",
            messagingSenderId: "66283609545",
            appId: "1:66283609545:web:2d63cea4490b14db331c18"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProducts = [];
        let currentShipping = 2.99;
        let wishlist = []; 

        window.onload = function() {
            db.ref('fieldflex/products').on('value', snapshot => {
                allProducts = snapshot.val() || [];
                loadCatalog();
            });

            db.ref('fieldflex/shipping').on('value', snapshot => {
                currentShipping = snapshot.val() || 2.99;
                updateCartUI();
            });
        };

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-btn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.innerText = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️';
            }
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
        }

        function loadCatalog() {
            const catalogGrid = document.getElementById('catalog-grid');
            const listosProducts = allProducts.filter(p => p.status === 'listos');

            if (listosProducts.length === 0) {
                catalogGrid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1 / -1; padding: 40px 0;">La colección se está actualizando. Vuelve pronto.</p>';
                return;
            }

            catalogGrid.innerHTML = '';

            listosProducts.forEach((product) => {
                const realIndex = allProducts.indexOf(product); 
                const totalStock = Object.values(product.stocks).reduce((a, b) => a + parseInt(b || 0), 0);
                const imgUrl = product.image && product.image.trim() !== '' ? product.image : 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500';

                let sizeOptions = '';
                for (const [size, qty] of Object.entries(product.stocks)) {
                    if (parseInt(qty) > 0) sizeOptions += `<option value="${size}">${size} (${qty} disp.)</option>`;
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-container">
                        <div class="stock-badge">${totalStock > 0 ? totalStock + ' en stock' : 'Agotado'}</div>
                        <img src="${imgUrl}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <div class="price-stock-summary" style="margin-bottom: 15px;">
                            <span class="product-name">${product.name}</span>
                            <span class="price">${product.price} €</span>
                        </div>
                        
                        <div style="margin-top: auto;">
                            <select class="size-select" id="size-select-${realIndex}">
                                ${sizeOptions !== '' ? sizeOptions : '<option value="">Agotado</option>'}
                            </select>
                            <button class="btn-add-cart" onclick="addToCart(${realIndex})">Añadir al pedido</button>
                        </div>
                    </div>
                `;
                catalogGrid.appendChild(card);
            });
        }

        function addToCart(pIndex) {
            const product = allProducts[pIndex];
            const sizeSelect = document.getElementById(`size-select-${pIndex}`);
            const selectedSize = sizeSelect.value;

            if (!selectedSize) {
                alert("Este producto está agotado.");
                return;
            }

            wishlist.push({
                name: product.name,
                price: parseFloat(product.price),
                size: selectedSize
            });

            updateCartUI();
            
            const cartPanel = document.getElementById('cart-sidebar');
            if(!cartPanel.classList.contains('open')) {
                toggleCart();
                setTimeout(() => toggleCart(), 2000); 
            }
        }

        function removeFromCart(cartIndex) {
            wishlist.splice(cartIndex, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            document.getElementById('cart-count').innerText = wishlist.length;

            if (wishlist.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Tu lista está vacía.</p>';
                document.getElementById('cart-subtotal').innerText = '0.00 €';
                document.getElementById('cart-shipping').innerText = '0.00 €';
                document.getElementById('cart-total').innerText = '0.00 €';
                return;
            }

            container.innerHTML = '';
            let subtotal = 0;

            wishlist.forEach((item, index) => {
                subtotal += item.price;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>Talla: ${item.size}</p>
                        <span class="remove-item" onclick="removeFromCart(${index})">Eliminar</span>
                    </div>
                    <div class="cart-item-price">${item.price.toFixed(2)} €</div>
                `;
                container.appendChild(itemDiv);
            });

            const total = subtotal + currentShipping;

            document.getElementById('cart-subtotal').innerText = `${subtotal.toFixed(2)} €`;
            document.getElementById('cart-shipping').innerText = `${currentShipping.toFixed(2)} €`;
            document.getElementById('cart-total').innerText = `${total.toFixed(2)} €`;
        }
    </script>
</body>
</html>
